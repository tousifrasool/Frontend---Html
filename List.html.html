<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Programming Languages </h1>
    <h2> Unordered list</h2>
    <ul>
        <li>java</li>
        <li>python</li>
        <li>javaScript</li>
        <li>c++</li>
    </ul>
    <h2> Ordered list</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>
    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>used to structure web pages.</dd>
        <dt>CSS</dt>
        <dd>used to style web pages.</dd>
        <dt>JavaScript</dt>
        <dd>used to add behaviour to web pages.</dd>
    </dl>
</body>
</html>
