<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Text</title>
</head>
<body>
    <h1>HTML Text</h1>

    <p>
        HTML is used to create <strong>web pages</strong>.
    </p>

    <p>
        HTML is <em>easy to learn</em>.
    </p>

    <p>
        This is <mark>important information</mark>.
    </p>

    <p>
        Old price: <del>1000rs</del> New price: 799
    </p>

    <h2>Useful Links</h2>

    <p>
        <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">Google</a>
    </p>

    <p>
        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a>
    </p>
</body>
</html>
